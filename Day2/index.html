<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Form</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="container">
    <form action="#">

      <!-- First Name -->
      <label for="fname">First Name</label>
      <input type="text" id="fname" name="firstname" placeholder="Your name.." required
             title="Please enter your first name">

      <!-- Last Name -->
      <label for="lname">Last Name</label>
      <input type="text" id="lname" name="lastname" placeholder="Your last name.." required
             title="Please enter your last name">

      <!-- Email -->
      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="example@domain.com" required
             pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$"
             title="Please enter a valid email (e.g. example@domain.com)">

      <!-- Phone -->
      <label for="phone">Phone</label>
      <input type="tel" id="phone" name="phone" placeholder="10-digit phone number" required
             pattern="[0-9]{10}"
             title="Please enter a 10-digit phone number without spaces">

      <!-- Subject -->
      <label for="subject">Subject</label>
      <textarea id="subject" name="subject" placeholder="Write something.." style="height:200px" required
                title="Please enter a message or subject"></textarea>

      <!-- Submit -->
      <input type="submit" value="Submit">

    </form>
  </div>

</body>
</html>
