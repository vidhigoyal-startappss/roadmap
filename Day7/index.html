<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product List</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <header class="header">
        <h1>Our Products</h1>
    </header>
    
    <main class="container">
        <aside class="sidebar">
            <div class="filter-group">
                <h3>Filters</h3>
            </div>

            <div class="filter-group">
                <h4>Search</h4>
                <input type="text" id="search-input" placeholder="Search by name...">
            </div>

            <div class="filter-group">
                <h4>Category</h4>
                <select id="category-filter">
                    <option value="all">All</option>
                    <option value="electronics">Electronics</option>
                    <option value="clothing">Clothing</option>
                    <option value="books">Books</option>
                    <option value="home">Home</option>
                </select>
            </div>

            <div class="filter-group">
                <h4>Price Range</h4>
                <div class="price-range">
                    <input type="number" id="min-price" placeholder="Min" value="0">
                    <span>-</span>
                    <input type="number" id="max-price" placeholder="Max" value="10000">
                </div>
                <button id="apply-price-filter">Apply</button>
            </div>

            <div class="filter-group">
                <h4>Sort By Price</h4>
                <select id="sort-price">
                    <option value="default">Default</option>
                    <option value="low-to-high">Low to High</option>
                    <option value="high-to-low">High to Low</option>
                </select>
            </div>
        </aside>

        <section class="product-area">
            <div class="control-bar">
                <p id="product-count">0 Products</p>
                <div class="view-toggle">
                    <button id="list-view-btn" class="active"><i class="fas fa-list"></i></button>
                    <button id="grid-view-btn"><i class="fas fa-th-large"></i></button>
                </div>
            </div>
            
            <div id="product-list" class="product-grid">
                </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
