<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Theme Toggle</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <div class="container">
    <h1>Toggle Theme Switcher</h1>
    <p>It is used to change the theme of the webpage through toggling.</p>
    <label class="switch">
      <input type="checkbox" id="themeToggle">
      <span class="slider"></span>
    </label>
    <p id="themeStatus">Current Theme: Light</p>
    <img id="themeIcon" src="light-theme.jpg" alt="Theme Icon" width="100">
  </div>
  <script src="script.js"></script>
</body>
</html>
